<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pricing Cards</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen flex items-center justify-center bg-gradient-to-br from-teal-400 to-teal-500">
<div class="bg-white rounded-2xl shadow-xl p-8 max-w-4xl w-full">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 text-center">
        <div class="flex flex-col items-center">
            <div class="w-24 h-24 rounded-full bg-teal-100 flex items-center justify-center mb-4">
                <img src="img/img.png" alt="personal__t-shirt">
            </div>
            <h3 class="uppercase tracking-widest text-gray-400 text-sm">Personal</h3>
            <ul class="mt-4 space-y-2 text-gray-500 text-sm">
                <li>1 Domain</li>
                <li>500 Disk Space</li>
                <li>E-mail Support</li>
            </ul>
            <p class="mt-6 text-2xl font-semibold text-gray-300">$0.00</p>
        </div>

        <div class="flex flex-col items-center">
            <div class="w-24 h-24 rounded-full bg-teal-200 flex items-center justify-center mb-4">
                <img src="img/img_1.png" alt="team__t-shirt">
            </div>
            <h3 class="uppercase tracking-widest text-teal-600 text-sm font-semibold">Team</h3>
            <ul class="mt-4 space-y-2 text-gray-600 text-sm">
                <li>5 Domain</li>
                <li>1000 Disk Space</li>
                <li>Mon-Fri Support</li>
            </ul>
            <p class="mt-6 text-2xl font-bold text-yellow-500">$99.99</p>
        </div>

        <div class="flex flex-col items-center">
            <div class="w-24 h-24 rounded-full bg-gray-200 flex items-center justify-center mb-4">
                <img src="img/img_2.png" alt="personal__t-shirt">
            </div>
            <h3 class="uppercase tracking-widest text-gray-500 text-sm font-semibold">Corporate</h3>
            <ul class="mt-4 space-y-2 text-gray-600 text-sm">
                <li>20 Domain</li>
                <li>Unlimited Disk Space</li>
                <li>24/7 Support</li>
            </ul>
            <p class="mt-6 text-2xl font-bold text-red-500">$399.9</p>
        </div>
    </div>
</div>
</body>
</html>
