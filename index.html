<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>price</title>
    <link rel="icon" href="https://img.icons8.com/?size=100&id=1pZPMj9d1wdA&format=png&color=000000">
</head>
<body class="body">
<div class="container">


    <div class="div__child">
        <p class="title">Basic</p>
        <p class="price">$199.99</p>
        <p class="line">500 gb storage</p>
        <p class="line">2 users allowed</p>
        <p class="line">send up to 3 gb</p>
        <p class="btn">learn more</p>
    </div>

    <div class="div__child__2">
        <p class="title">Professional</p>
        <p class="price">$249.99</p>
        <p class="line">1 tb storage</p>
        <p class="line">5 users allowed</p>
        <p class="line">send up to 10 gb</p>
        <p class="btn__1">learn more</p>
    </div>

    <div class="div__child">
        <p class="title">Master</p>
        <p class="price">$399.99</p>
        <p class="line">2 tb storage</p>
        <p class="line">10 users allowed</p>
        <p class="line">send up to 20 gb</p>
        <p class="btn">learn more</p>
    </div>

</div>

<link rel="stylesheet" href="main.css">
</body>
</html>
